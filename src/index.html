<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Painel de Cotações</title>
</head>

<body class="dashboard-body">
  <header class="dashboard-header">
    <div class="dashboard-header-left">
      <span id="live-dot" class="live-dot" title="Conectado ao servidor"></span>
      <h1>Café Arábica</h1>
    </div>
    <div class="dashboard-header-right">
      <span id="connection-status" class="status-badge status-connecting">conectando...</span>
      <button id="logout-btn" class="logout-btn" title="Sair">Sair</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="quotes-table-wrap">
      <table class="quotes-table">
        <thead>
          <tr>
            <th>Venc</th>
            <th>Último</th>
            <th>Diff</th>
            <th>Oscil. %</th>
            <th>Abert</th>
            <th>Max</th>
            <th>Min</th>
            <th>Fech</th>
            <th>Compra</th>
            <th>Venda</th>
            <th>Contrat.<br>Aberto</th>
            <th>Contrat.<br>Negoc.</th>
            <th>Ajuste</th>
          </tr>
        </thead>
        <tbody id="quotes-body"></tbody>
      </table>
    </div>

    <footer class="dashboard-footer">
      <span id="clock" class="clock"></span>
      <span id="user-name" class="user-name"></span>
    </footer>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
